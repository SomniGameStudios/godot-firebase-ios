name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead? Steps to reproduce help a lot.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "plugin 1.0.1, Godot 4.4.1, iOS 18.5"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Xcode console output, stack traces, or Godot logs.
      render: shell
    validations:
      required: false
