name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Xcode cache version
        id: xcode_version
        shell: bash
        run: |
          xcode_version="$(xcodebuild -version)"
          digest="$(printf '%s' "$xcode_version" | shasum -a 256 | cut -d ' ' -f 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: GodotFirebaseiOS/.build/xcodebuild
          key: ${{ runner.os }}-xcode-${{ steps.xcode_version.outputs.digest }}-${{ hashFiles('GodotFirebaseiOS/Package.resolved', 'GodotFirebaseiOS/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ steps.xcode_version.outputs.digest }}-

      - name: Cache Firebase SDK
        uses: actions/cache@v6
        with:
          path: firebase_sdk
          key: firebase-sdk-${{ hashFiles('Makefile') }}

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Build iOS framework (Debug)
        run: make setup && make build
