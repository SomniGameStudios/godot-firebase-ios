name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: GodotFirebaseiOS/.build/xcodebuild/SourcePackages
          key: ${{ runner.os }}-xcode-spm-${{ hashFiles('GodotFirebaseiOS/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-spm-

      - name: Cache Firebase SDK
        uses: actions/cache@v6
        with:
          path: firebase_sdk
          key: firebase-sdk-${{ hashFiles('Makefile') }}

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Build iOS framework (Debug)
        run: make setup && make build
