name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: GodotFirebaseiOS/.build/xcodebuild/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('GodotFirebaseiOS/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Approach A: build the merged xcframework via SwiftPM (PR smoke test, unsigned).
      - name: Build iOS framework
        run: ./GodotFirebaseiOS/build_and_copy.sh release
