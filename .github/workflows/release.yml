name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: GodotFirebaseiOS/.build/xcodebuild/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('GodotFirebaseiOS/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Approach A: single static-merged xcframework (Firebase baked in) via SwiftPM.
      # Shipped UNSIGNED — the consuming app re-signs with its distribution identity
      # before archive (ITMS-91065). SIGN_IDENTITY left empty on purpose.
      - name: Build release
        run: ./GodotFirebaseiOS/build_and_copy.sh release

      - name: Package addon zip
        run: |
          cd demo
          zip -r "../GodotFirebaseiOS-${{ inputs.version }}.zip" addons/GodotFirebaseiOS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            EXTRA_FLAGS="--prerelease"
          fi
          gh release create "${{ inputs.version }}" \
            --title "GodotFirebaseiOS ${{ inputs.version }}" \
            --generate-notes \
            $EXTRA_FLAGS \
            "GodotFirebaseiOS-${{ inputs.version }}.zip"
