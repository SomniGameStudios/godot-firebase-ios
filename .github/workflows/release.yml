name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
        type: string

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: GodotFirebaseiOS/.build/xcodebuild
          key: ${{ runner.os }}-xcode-${{ hashFiles('GodotFirebaseiOS/Package.resolved', 'GodotFirebaseiOS/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Cache Firebase SDK
        uses: actions/cache@v6
        with:
          path: firebase_sdk
          key: firebase-sdk-${{ hashFiles('Makefile') }}

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Build release
        run: make setup && make build

      - name: Package addon zip
        run: |
          cd demo
          zip -r "../GodotFirebaseiOS-${{ inputs.version }}.zip" addons/GodotFirebaseiOS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" \
            --title "GodotFirebaseiOS ${{ inputs.version }}" \
            --generate-notes \
            "GodotFirebaseiOS-${{ inputs.version }}.zip"
