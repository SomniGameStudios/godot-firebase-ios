name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
        type: string

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Xcode cache version
        id: xcode_version
        shell: bash
        run: |
          xcode_version="$(xcodebuild -version)"
          digest="$(printf '%s' "$xcode_version" | shasum -a 256 | cut -d ' ' -f 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: GodotFirebaseiOS/.build/firebase-*/xcodebuild
          key: ${{ runner.os }}-xcode-${{ steps.xcode_version.outputs.digest }}-${{ hashFiles('Makefile', 'scripts/setup_firebase_sdk.py', 'GodotFirebaseiOS/project.yml', 'GodotFirebaseiOS/Package.swift', 'GodotFirebaseiOS/Package.resolved', 'GodotFirebaseiOS/Sources/**') }}

      - name: Cache Firebase SDK
        uses: actions/cache@v6
        with:
          path: firebase_sdk
          key: firebase-sdk-${{ hashFiles('Makefile', 'scripts/setup_firebase_sdk.py') }}

      - name: Test SDK setup
        run: make test

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Build release
        run: make test-link && make build

      - name: Package addon zip
        run: |
          cd demo
          zip -r "../GodotFirebaseiOS-${{ inputs.version }}.zip" addons/GodotFirebaseiOS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" \
            --title "GodotFirebaseiOS ${{ inputs.version }}" \
            --generate-notes \
            "GodotFirebaseiOS-${{ inputs.version }}.zip"
